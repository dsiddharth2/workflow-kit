services:
  fleet:
    build: .
    ports:
      - "${MCP_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      MCP_BIND_HOST: "0.0.0.0"
    # Default: provision (HTTP Fleet) + MCP server. The MCP process spawns
    # Fleet over stdio. Override for anything else:
    #   docker compose run --rm fleet node workflows/demo/main.mjs
    #   docker compose run --rm fleet node --test tests/demo.test.mjs

volumes:
  node_modules:
