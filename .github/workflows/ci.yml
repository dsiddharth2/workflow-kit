name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Fast job — no Fleet, no Docker. Runs pool/dispatcher/config unit tests.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # Full job — builds the Docker image with Fleet installed, runs the
  # complete test suite (unit + integration) and a load test inside it.
  # Posts load test results as a PR comment.
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workflow-kit-ci .

      - name: Run full test suite (unit + integration)
        run: |
          docker run --rm workflow-kit-ci \
            node --test \
              tests/transport-stdio-fleet.test.mjs \
              tests/pool-roster.test.mjs \
              tests/pool-cleanup.test.mjs \
              tests/pool-worker-lock.test.mjs \
              tests/pool-fleet-text.test.mjs \
              tests/pool-pooled-fleet-api.test.mjs \
              tests/pool-worker-pool.test.mjs \
              tests/pool-config.test.mjs \
              tests/pool-member-manager.test.mjs \
              tests/pool-ephemeral-factory.test.mjs \
              tests/pool-worker-dispatcher.test.mjs \
              tests/pool-index.test.mjs \
              tests/demo.test.mjs \
              tests/inspect-members.test.mjs \
              tests/mcp.test.mjs

      - name: Load test — reduced capacity (pool=2, ephemeral=3, 8 concurrent)
        id: load-reduced
        run: |
          output=$(docker run --rm \
            -e WORKER_POOL_SIZE=2 \
            -e WORKER_EPHEMERAL_MAX=3 \
            -e WORKER_DISPATCH_QUEUE_SIZE=10 \
            workflow-kit-ci \
            node tests/load-test.mjs --tool inspect-members --concurrency 8 2>&1 \
            | grep -A 1000 '┌─')
          echo "report<<LOAD_EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "LOAD_EOF" >> "$GITHUB_OUTPUT"

      - name: Load test — full capacity (default, 20 concurrent)
        id: load-full
        run: |
          output=$(docker run --rm \
            workflow-kit-ci \
            node tests/load-test.mjs --tool inspect-members --concurrency 20 2>&1 \
            | grep -A 1000 '┌─')
          echo "report<<LOAD_EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "LOAD_EOF" >> "$GITHUB_OUTPUT"

      - name: Post load test report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reduced = `${{ steps.load-reduced.outputs.report }}`;
            const full = `${{ steps.load-full.outputs.report }}`;
            const body = [
              '## Load Test Results',
              '',
              '### Reduced capacity (pool=2, ephemeral=3, 8 concurrent)',
              '```',
              reduced,
              '```',
              '',
              '### Full capacity (default, 20 concurrent)',
              '```',
              full,
              '```',
            ].join('\n');

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Load Test Results';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
